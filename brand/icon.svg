<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- RC Pair app icon: a phone (Dynamic Island pill at the top) with an outside node (orange) docked into a socket in its edge across a constant gap. Full-bleed opaque square, no baked corners; the OS masks it. -->
